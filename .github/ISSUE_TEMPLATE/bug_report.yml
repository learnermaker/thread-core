name: Bug report
description: Something is broken in thread-core
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        A minimal script or test that triggers the bug.
        Prefer a call to `createThreadApp` with a seed and one or two operations.
      placeholder: |
        const app = createThreadApp({ store: memoryStore(), clock: fixedClock("..."), types: householdTypes });
        const r = await app.someOperation(principal, input);
        console.log(r);
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: thread-core version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "24.x"
    validations:
      required: false
